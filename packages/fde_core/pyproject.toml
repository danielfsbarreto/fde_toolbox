[project]
name = "fde-core"
version = "0.1.0"
description = "Shared contract of the FDE Activity Log: the daily log models and MongoDB access, used by every flow"
authors = [{ name = "Daniel Barreto", email = "daniel@crewai.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "cryptography>=43",
    "pydantic>=2.10,<3",
    "pymongo>=4.18,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fde_core"]

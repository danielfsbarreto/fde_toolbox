[project]
name = "fde-review-api"
version = "0.1.0"
description = "Thin backend of the FDE daily review app (hosted on Heroku); independent of the AMP flow package"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pymongo>=4.18,<5",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.28,<1",
    "itsdangerous>=2.2,<3",
    "cryptography>=43",
    "python-dotenv>=1.2,<2",
    "weasyprint>=66,<70",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
